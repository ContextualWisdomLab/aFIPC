name: Code Quality

on:
  push:
    branches: ["master", "main"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, closed]
    branches: ["master", "main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Lint workflow YAML
        run: |
          python3 -m pip install --user yamllint
          python3 -m yamllint .yamllint.yml .github/dependabot.yml .github/workflows/*.yml

      - name: Validate workflow concurrency contract
        run: |
          python3 scripts/ci/test_workflow_concurrency_contract_unit.py
          python3 scripts/ci/test_workflow_concurrency_contract.py

      - name: Lint markdown docs
        run: |
          npm install -g markdownlint-cli2@0.18.1
          markdownlint-cli2 README.md AGENTS.md ARCHITECTURE.md CLAUDE.md CONTRIBUTING.md .github/**/*.md docs/**/*.md

      - name: Lint GitHub workflows
        run: |
          ACTIONLINT_VERSION="1.7.10"
          ACTIONLINT_FILE="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          ACTIONLINT_BASE_URL="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -sSLo "$ACTIONLINT_FILE" "${ACTIONLINT_BASE_URL}/${ACTIONLINT_FILE}"
          curl -sSLo actionlint_checksums.txt "${ACTIONLINT_BASE_URL}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep "$ACTIONLINT_FILE" actionlint_checksums.txt | sha256sum -c -
          tar -xzf "$ACTIONLINT_FILE" actionlint
          chmod +x actionlint
          ./actionlint
