name: R CMD check

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r-cmd-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      R_PROFILE_USER: /dev/null

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make

      - name: Set up R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6
        with:
          r-version: '4.5.3'
          use-public-rspm: true

      - name: Set up R package dependencies
        uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Build verified ABI-compatible R dependencies
        shell: bash
        run: |
          set -euo pipefail

          install_verified_source() {
            local package="$1"
            local version="$2"
            local url="$3"
            local expected_sha256="$4"
            local archive
            archive="$(mktemp --suffix=.tar.gz)"

            curl --fail --show-error --silent --location \
              --proto '=https' --tlsv1.2 "$url" --output "$archive"
            printf '%s  %s\n' "$expected_sha256" "$archive" |
              sha256sum --check --strict
            R CMD INSTALL "$archive"
            rm -f "$archive"

            Rscript -e "stopifnot(as.character(packageVersion('$package')) == '$version'); cat(normalizePath(find.package('$package')), '\n')"
          }

          install_verified_source \
            RcppParallel 6.2.0 \
            https://cran.r-project.org/src/contrib/RcppParallel_6.2.0.tar.gz \
            3b6eaf73a696059552186292c79233916267f8e2b5c9a309519391d16c5a8bbe
          install_verified_source \
            qs2 0.2.2 \
            https://cran.r-project.org/src/contrib/qs2_0.2.2.tar.gz \
            c59ff879e858aef0afb13de25127239624e65b20179c8631fa1f62edea25f48f

      - name: Run R CMD check
        uses: r-lib/actions/check-r-package@6f6e5bc62fba3a704f74e7ad7ef7676c5c6a2590
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"error"'
